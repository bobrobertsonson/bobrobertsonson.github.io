<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Plan your tattoo (prototype)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75,700&family=Inter:wght@400;600&family=Newsreader:opsz,wght@6..72,400&display=swap">
<style>
/* VOICE: Tim's site, dark and blunt. IDEA: a step-by-step planner that builds a picture of the idea as you go.
   PICTURE: the "your idea so far" card (body map, background, color) that fills in with every step.
   COLOUR: ink, bone, red #C13B2E. TYPE: Archivo condensed (stand-in for Clash Display), Newsreader, Inter.
   LAYOUT: step on the left, idea card on the right; stacks under 900px with the card first. */
:root{color-scheme:dark;--red:#c13b2e;--ink:#0f0e0d;--bone:#e8e4dc;--iron:#3a3835;--paper:#f1ece1;--display:"Archivo","Arial Narrow",sans-serif;--body:"Newsreader",Georgia,serif;--ui:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0;border-radius:0}
html,body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--ui);overflow-x:clip}
a{color:var(--bone)}
.demo{background:var(--red);font:600 13px/1.4 var(--ui);padding:8px max(5vw,16px);text-align:center}
.wrap{max-width:1180px;margin:0 auto;padding:32px max(4vw,16px) 64px}
.narrow{max-width:640px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:40px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)}.card{order:-1}}
.eyebrow{font:600 13px/1 var(--ui);color:var(--red);margin:0}
h1{font:700 clamp(30px,4.6vw,48px)/1.02 var(--display);font-stretch:75%;text-transform:uppercase;margin:10px 0 12px;text-wrap:balance}
h2{font:700 22px/1.1 var(--display);font-stretch:75%;text-transform:uppercase;margin:24px 0 10px}
.body{font:400 19px/1.5 var(--body);margin:0 0 16px}
.small{font-size:16px;opacity:.75}
.btn{background:var(--red);color:var(--bone);border:1px solid var(--red);min-height:44px;padding:12px 20px;font:600 14px var(--ui);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.ghost{background:transparent;border-color:var(--bone)}
.link{background:none;border:0;color:var(--bone);text-decoration:underline;cursor:pointer;font:14px var(--ui);min-height:44px;padding:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:24px}
.row .spacer{flex:1}
input,textarea,select{width:100%;background:var(--ink);color:var(--bone);border:1px solid var(--iron);padding:12px;font:16px var(--ui);resize:vertical}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:8px}
@media(max-width:600px){.pair{grid-template-columns:minmax(0,1fr)}}
.label{font:600 14px var(--ui);margin:16px 0 8px;display:block}
.opt{font-weight:400;opacity:.6}
.check{display:flex;align-items:center;gap:10px;font:16px var(--ui);min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--red)}
.error{color:#ff8a7a;font-size:14px}
.steps{display:flex;gap:4px;margin:0 0 20px;list-style:none;padding:0}
.steps li{flex:1;height:4px;background:var(--iron)}
.steps li.done{background:var(--bone)}
.steps li.now{background:var(--red)}
.stepname{font:600 13px var(--ui);opacity:.7;margin:0 0 4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:none;border:2px solid var(--iron);padding:0;color:var(--bone);cursor:pointer;text-align:left;display:flex;flex-direction:column}
.tile.on{border-color:var(--red)}
.tile svg{width:100%;height:auto;display:block}
.tile span{display:block;padding:8px 10px;font:14px/1.3 var(--ui)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--iron);color:var(--bone);padding:8px 12px;font:14px var(--ui);cursor:pointer;min-height:40px}
.chip.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:600px){.sizes{grid-template-columns:minmax(0,1fr)}}
.size{background:none;border:2px solid var(--iron);color:var(--bone);padding:14px;text-align:left;cursor:pointer;font:600 15px/1.3 var(--ui)}
.size small{display:block;font-weight:400;opacity:.7;margin-top:4px}
.size.on{border-color:var(--red)}
.spaceGrid{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:16px;align-items:start}
@media(max-width:600px){.spaceGrid{grid-template-columns:minmax(0,1fr)}}
.spaceList{display:flex;flex-wrap:wrap;gap:6px}
.card{background:var(--paper);color:var(--ink);padding:18px;position:sticky;top:16px}
@media(max-width:900px){.card{position:static}}
.card h2{margin:0 0 10px;color:var(--ink)}
.card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:12px 0 0;font:14px/1.35 var(--ui)}
.card dt{font-weight:600}
.card dd{margin:0}
.card .empty{opacity:.45}
.cardviz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}
.cardviz svg{width:100%;height:auto;display:block}
.mini{display:flex;flex-direction:column;gap:6px}
.mini svg{border:1px solid #cfc7b8}
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.concepts svg{width:100%;height:auto;display:block}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:8px}
.thumb{position:relative;padding:0;border:1px solid var(--iron);background:none;cursor:pointer}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.thumb span{position:absolute;inset:auto 0 0 0;background:rgba(15,14,13,.8);color:var(--bone);font:12px var(--ui);padding:4px}
.brief{font:14px/1.5 ui-monospace,Menlo,monospace}
.helper{margin-top:28px;border-top:1px solid var(--iron);padding-top:4px}
.msg{padding:10px 14px;font:400 17px/1.45 var(--body);background:var(--iron);margin:8px 0}
.msg.user{background:var(--bone);color:var(--ink);margin-left:15%}
.note{font:13px/1.4 var(--ui);opacity:.6;margin-top:8px}
.promptbox{border:1px dashed var(--iron);padding:12px;margin-top:16px}
.promptbox textarea{font:13px/1.5 ui-monospace,Menlo,monospace}
@media(prefers-reduced-motion:no-preference){.card .hl{animation:pulse 1.2s ease-out}@keyframes pulse{from{fill-opacity:.25}to{fill-opacity:1}}}

.log{display:flex;flex-direction:column;gap:12px;padding:4px 0 12px}
.msg{max-width:88%;padding:12px 16px;font:400 18px/1.45 var(--body);white-space:pre-wrap;margin:0}
.msg.ai{background:var(--iron);align-self:flex-start}
.msg.me{background:var(--bone);color:var(--ink);align-self:flex-end}
.dim{opacity:.55}
.saved{align-self:flex-end;font:12px/1.4 var(--ui);opacity:.7;margin-top:-6px;max-width:88%;text-align:right}
.saved::before{content:"✓ ";color:var(--red);font-weight:700}
.imgcard{align-self:flex-start;width:min(340px,88%);background:var(--paper);color:var(--ink);padding:8px;margin:0}
.imgcard svg{width:100%;height:auto;display:block}
.imgcard details{font:13px/1.4 var(--ui);margin-top:6px}
.imgcard summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.imgcard textarea{background:#fff;color:var(--ink);border-color:#cfc7b8;font:12px/1.5 ui-monospace,Menlo,monospace}
.composer{display:flex;gap:8px}
.composer textarea{resize:none;min-height:48px}
</style>
</head>
<body>
<div class="demo">Prototype: the AI replies are scripted and the sketches are placeholders. Nothing is sent anywhere.</div>
<div id="app"></div>
<script>
{
const IG = "meanoldtim", EMAIL = "meanoldtim@gmail.com", MAX_IMAGES = 10;
const STEPS = ["Subject", "Size and placement", "Background", "Color", "Anything else?", "Wrap it up"];
const SIZES = [["Single session tattoo", "One sitting. Smaller pieces."], ["Large tattoo (2-3 sessions)", "Thigh, butt cheek, forearm and so on."], ["Multi session tattoo", "Sleeves, back pieces, full fronts."]];
const MULTI = SIZES[2][0], LARGE = SIZES[1][0];
const SPACES = {
  "Back with butt": ["b-upper", "b-lower", "b-butt"], "Back to belt line": ["b-upper", "b-lower"], "Back to knees": ["b-upper", "b-lower", "b-butt", "b-thighL", "b-thighR"],
  "Sleeve": ["f-uarmL", "f-farmL"], "3/4 sleeve": ["f-uarmL", "f-farmL"], "1/2 sleeve (elbow to wrist)": ["f-farmL"], "Leg sleeve": ["f-thighL", "f-calfL"], "Leg": ["f-thighL", "f-calfL"],
  "Ribs / side": ["f-ribsL"], "Pecs": ["f-chest"], "Belly": ["f-belly"], "Full front": ["f-chest", "f-belly", "f-ribsL", "f-ribsR"], "Butt": ["b-butt"],
  "Hand": ["f-handL"], "Foot": ["f-footL"], "Neck": ["f-neck"], "Head": ["f-head"],
};
const NOTE_SPACES = ["Leg", "Neck", "Head"];
const KEYWORDS = [["forearm", ["f-farmL"]], ["upper arm", ["f-uarmL"]], ["bicep", ["f-uarmL"]], ["shoulder", ["f-uarmL"]], ["thigh", ["f-thighL"]], ["calf", ["f-calfL"]], ["shin", ["f-calfL"]], ["butt", ["b-butt"]], ["chest", ["f-chest"]], ["pec", ["f-chest"]], ["rib", ["f-ribsL"]], ["side", ["f-ribsL"]], ["belly", ["f-belly"]], ["stomach", ["f-belly"]], ["back", ["b-upper"]], ["hand", ["f-handL"]], ["foot", ["f-footL"]], ["ankle", ["f-footL"]], ["neck", ["f-neck"]]];
const BGS = ["Water", "Wind bars / clouds", "Water into clouds", "Fog", "Blackout", "Blackout with clouds", "No background", "Let Tim decide"];
const BG_LABEL = { "Wind bars / clouds": "Clouds" };
const BG_NOTES = { "Water into clouds": "Water at the bottom, clouds at the top.", "Blackout with clouds": "Solid black with clouds layered over it." };
const COLORS = ["Black and grey", "Black, red(s) and grey", "Full color", "Let Tim decide"];
const SUBJECT_CHIPS = ["Panther", "Koi", "Eagle", "Dragon", "Tiger", "Snake", "Roses", "Peonies", "Dagger", "Swallow", "Skull", "Lady head"];
// for reading the open chat: [name, pattern]
const SUBJECTS = [["koi", /\bkoi\b/], ["dragon", /\bdragons?\b/], ["tiger", /\btigers?\b/], ["snake", /\bsnakes?\b/], ["hannya", /\bhannya\b/], ["phoenix", /\bphoenix\b/], ["panther", /\bpanthers?\b/], ["eagle", /\beagles?\b/], ["wolf", /\bwol(f|ves)\b/], ["swallow", /\bswallows?\b/], ["ship", /\bships?\b/], ["lady head", /\blady ?head|pin.?up\b/], ["dagger", /\bdaggers?\b/], ["owl", /\bowls?\b/], ["moth", /\bmoths?\b/], ["butterfly", /\bbutterfl(y|ies)\b/], ["skull", /\bskulls?\b/], ["crane", /\bcranes?\b/], ["roses", /\broses?\b/], ["peonies", /\bpeon(y|ies)\b/], ["cherry blossoms", /\bcherry blossoms?\b|\bsakura\b/], ["chrysanthemums", /\bchrysanthemums?\b/], ["lotus", /\blotus/], ["heart", /\bhearts?\b/]];

const STYLE_PROMPT = "Traditional tattoo flash illustration in a Japanese and American traditional style: bold black outlines, solid fills, minimal shading, clean negative space, plain off-white paper background, no text, no signature, no logo, no realistic photography. Follow the color instruction exactly.";
const BG_PROMPT = { "Water": "stylized traditional water and waves in the background", "Wind bars / clouds": "stylized traditional clouds and wind bars in the background", "Water into clouds": "stylized traditional water and waves at the bottom transitioning into clouds at the top", "Fog": "soft traditional fog shapes in the background", "Blackout": "a solid black background with the subject in negative space", "Blackout with clouds": "a solid black background with no negative wind bars, layered traditional clouds over it", "No background": "no background, subject isolated on the paper", "Let Tim decide": "a simple traditional background that suits the subject" };
const COLOR_PROMPT = { "Black and grey": "black and grey only, no color", "Black, red(s) and grey": "black and grey with red accents only", "Full color": "full traditional color", "Let Tim decide": "limited traditional color" };

const fresh = () => ({ stage: "plan", step: 0,
  f: { main: ["", ""], sec: ["", ""], size: "", space: "", place: "", bg: "", color: "", name: "", contact: "", cover: false, tattooer: false, travel: "" },
  said: [], dos: [], donts: [], log: [], sketches: 0, photos: [], busy: false, err: "", brief: "", briefEdited: false, copied: false, sentBy: "email", confirmRestart: false,
  id: "MOT-" + (1000 + Math.floor(Math.random() * 9000)) });
const S = { ...fresh(), stage: "gate" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const app = document.getElementById("app");
const isMulti = () => S.f.size === MULTI;
const needsNote = () => !!S.f.size && (!isMulti() || NOTE_SPACES.includes(S.f.space));
const mains = () => S.f.main.map(x => x.trim()).filter(Boolean);
const secs = () => S.f.sec.map(x => x.trim()).filter(Boolean);
const bgName = b => BG_LABEL[b] || b;
function regions() {
  if (isMulti()) return SPACES[S.f.space] || [];
  const t = S.f.place.toLowerCase();
  return [...new Set(KEYWORDS.filter(([k]) => t.includes(k)).flatMap(([, r]) => r))];
}
function spaceLine() { const f = S.f, p = f.place.trim(); if (!f.size) return ""; return isMulti() ? `Multi session, ${f.space || "space not picked"}${p ? ` (${p})` : ""}` : `${f.size}${p ? `, ${p}` : ""}`; }

function stepTodo(i) {
  const f = S.f, o = [];
  if (i === 0 && !mains().length) o.push("a main subject");
  if (i === 1) { if (!f.size) o.push("a size"); if (isMulti() && !f.space) o.push("a space"); if (needsNote() && !f.place.trim()) o.push("where on your body"); }
  if (i === 2 && !f.bg) o.push("a background");
  if (i === 3 && !f.color) o.push("a color choice");
  if (i === 5) { if (!f.name.trim()) o.push("your name"); if (!f.contact.trim()) o.push("your Instagram or email"); if (f.cover && !S.photos.length) o.push("a photo of the tattoo you're covering"); }
  return o;
}

function imagePrompt(change) {
  const f = S.f, where = isMulti() ? f.space : (f.place.trim() || "medium-sized area");
  const subject = [`Main subject: ${mains().join(" and ")}.`, secs().length && `Secondary elements: ${secs().join(" and ")}.`,
    `Composition: a design shaped to fit a ${where.toLowerCase()}${isMulti() ? ", large multi session piece" : ""}.`,
    BG_PROMPT[f.bg] && `Background: ${BG_PROMPT[f.bg]}.`, COLOR_PROMPT[f.color] && `Color: ${COLOR_PROMPT[f.color]}.`,
    S.said.length && `Client notes: ${S.said.join(" ").slice(0, 300)}`, change && `Change from last version: ${change}`].filter(Boolean).join(" ");
  return `${STYLE_PROMPT}\n\nSubject: ${subject}`;
}
const sketchLine = () => [mains().join(" + "), bgName(S.f.bg), S.f.color].filter(Boolean).join(" / ");

// ---- the open chat ("Anything else?") ----
// The live version uses Claude to read what they say; the demo listens for a few keywords.
function setSlot(k, v) { const i = S.f[k].findIndex(x => !x.trim()); if (i >= 0) { S.f[k][i] = v; return true; } return false; }
function listen(text) {
  const t = " " + text.toLowerCase() + " ", f = S.f, saved = [];
  for (const [s, re] of SUBJECTS) {
    const hit = t.match(re); if (!hit) continue;
    const has = [...f.main, ...f.sec].some(x => x.toLowerCase() === s);
    if (/\b(no|not|without|don'?t( want)?|lose the|get rid of|instead of|drop the|remove the)\b[^.,!?]{0,15}$/.test(t.slice(0, hit.index))) {
      if (has) { f.main = f.main.map(x => x.toLowerCase() === s ? "" : x); f.sec = f.sec.map(x => x.toLowerCase() === s ? "" : x); saved.push(`removed ${s}`); }
      continue;
    }
    if (!has && (setSlot("sec", s) || setSlot("main", s))) saved.push(s);
  }
  const water = /water|waves?|ocean|sea/.test(t), cloud = /clouds?|wind/.test(t), black = /blackout|black background/.test(t);
  let bg = black && cloud ? "Blackout with clouds" : black ? "Blackout" : water && cloud ? "Water into clouds" : water ? "Water" : cloud ? "Wind bars / clouds" : /no background|keep it clean/.test(t) ? "No background" : "";
  if (bg && bg !== f.bg) { f.bg = bg; saved.push(`background: ${bgName(bg).toLowerCase()}`); }
  let color = /black (and|&) gr[ae]y|no colou?r/.test(t) ? "Black and grey" : /\breds?\b/.test(t) ? "Black, red(s) and grey" : /full colou?r/.test(t) ? "Full color" : "";
  if (color && color !== f.color) { f.color = color; saved.push(color.toLowerCase()); }
  if (/cover[- ]?up/.test(t) && !f.cover) { f.cover = true; saved.push("cover-up"); }
  const clean = text.trim().replace(/\s+/g, " ").slice(0, 160);
  if (/\b(no|not|don'?t|less|without|too|never|hate|instead of|lose the|get rid)\b/.test(t)) { if (!S.donts.includes(clean)) { S.donts.push(clean); saved.push(`don't want: "${clean}"`); } }
  else if (/\b(more|add|keep|love|like|want|must|needs? to|make (it|the))\b/.test(t)) { if (!S.dos.includes(clean)) { S.dos.push(clean); saved.push(`want: "${clean}"`); } }
  else if (clean.length > 20) { S.said.push(clean); saved.push("noted, in your words"); }
  return saved;
}
const looksLikeChat = t => t.length > 300 || /^(you said|you|me|user|chatgpt|assistant|gemini)\s*:/im.test(t);
function sketch(change) { if (S.sketches >= MAX_IMAGES) return false; S.sketches++; S.log.push({ r: "img", n: S.sketches, line: sketchLine() + (change ? ` / ${change}` : ""), prompt: imagePrompt(change) }); return true; }
function startRiff() {
  if (S.log.length) return;
  S.log.push({ r: "ai", t: "Here's a first sketch from what you picked. It's just for you to think with. It's not your tattoo and Tim never sees it." });
  sketch("");
  S.log.push({ r: "ai", t: "Anything else? Edit it from here as much as you want. Been working on it in ChatGPT? Paste that conversation in too. When you're happy, hit Wrap it up for Tim." });
}
function send(text) {
  text = text.trim(); if (!text || S.busy) return;
  if (looksLikeChat(text)) {
    const lines = text.split(/\n+/).map(l => l.replace(/^(you said|you|me|user|human)\s*:?\s*/i, "").trim()).filter(l => l && !/^(chatgpt|assistant|gemini|ai)\s*:?/i.test(l));
    S.log.push({ r: "me", t: `[Pasted a conversation, ${lines.length} message${lines.length === 1 ? "" : "s"} from you]` });
    const saved = lines.flatMap(l => listen(l));
    if (saved.length) S.log.push({ r: "saved", t: `Saved for Tim: ${[...new Set(saved)].slice(0, 8).join(" · ")}${saved.length > 8 ? " · and more" : ""}` });
    S.busy = true; render();
    setTimeout(() => { S.log.push({ r: "ai", t: "Got it. What you decided over there is saved for Tim. Images from other tools stay with you." }); sketch("from your pasted conversation"); S.log.push({ r: "ai", t: "Anything else?" }); S.busy = false; render(); }, 900);
    return;
  }
  S.log.push({ r: "me", t: text });
  const saved = listen(text);
  if (saved.length) S.log.push({ r: "saved", t: `Saved for Tim: ${saved.join(" · ")}` });
  S.busy = true; render();
  setTimeout(() => {
    if (sketch(text.slice(0, 200))) S.log.push({ r: "ai", t: "Here you go. Anything else?" });
    else S.log.push({ r: "ai", t: `That's the ${MAX_IMAGES}-sketch limit. You've got plenty to think with. Wrap it up and Tim takes it from here.` });
    S.busy = false; render(); document.getElementById("in")?.focus();
  }, 700);
}

function briefText() {
  const f = S.f, list = xs => xs.map(x => `- ${x}`).join("\n");
  const open = [!S.photos.length && "no placement photos yet", f.cover && "cover-up: check the old tattoo on a call or in person", isMulti() && "confirm size and flow on the body"].filter(Boolean);
  return [`TATTOO BRIEF ${S.id}`, ``, `From: ${f.name.trim()} (${f.contact.trim()})`, ``, `THE ESSENTIALS`,
    `Main subject: ${mains().join(" + ")}`, secs().length ? `Secondary: ${secs().join(" + ")}` : null, `Space: ${spaceLine()}`, `Background: ${f.bg}`, `Color: ${f.color}`,
    f.cover ? `Cover-up: YES` : null, f.tattooer ? `Client is a tattooer` : null, S.photos.length ? `Reference/placement photos: ${S.photos.length} attached` : null, f.travel.trim() ? `Travel: ${f.travel.trim()}` : null,
    (S.said.length || S.dos.length || S.donts.length) ? `\nFROM THEIR SESSION` : null, S.said.length ? `In their words:\n${list(S.said)}` : null,
    S.dos.length ? `They want:\n${list(S.dos)}` : null, S.donts.length ? `They don't want:\n${list(S.donts)}` : null,
    ``, `STILL OPEN FOR TIM`, open.length ? list(open) : "- nothing flagged", `Suggested next step: ${f.cover ? "quick call or visit" : "ready to plan and book"}`].filter(l => l !== null).join("\n");
}

let bodyN = 0;
function body(on) {
  const n = ++bodyN, INK = "#0f0e0d", SKIN = "#ddd5c6", RED = "#c13b2e";
  const torso = c => `M${c-16},57 L${c+16},57 Q${c+32},58 ${c+32},72 Q${c+30},96 ${c+22},124 Q${c+30},140 ${c+27},156 Q${c+14},166 ${c},164 Q${c-14},166 ${c-27},156 Q${c-30},140 ${c-22},124 Q${c-30},96 ${c-32},72 Q${c-32},58 ${c-16},57 Z`;
  // limbs as round-capped strokes: [id, x1, y1, x2, y2, width]
  const limbs = c => [
    ["uarmL", c-30, 66, c-42, 116, 15], ["farmL", c-42, 116, c-48, 162, 12],
    ["uarmR", c+30, 66, c+42, 116, 15], ["farmR", c+42, 116, c+48, 162, 12],
    ["thighL", c-14, 150, c-15, 214, 25], ["calfL", c-15, 214, c-14, 266, 18],

const waves = (y0, n, stroke = "#0f0e0d", sw = 3) => Array.from({ length: n }, (_, i) => `<path d="M-10 ${y0 + i * 14} q15 -12 30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="${stroke}" stroke-width="${sw}"/>`).join("");

app.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const a = b.dataset.a, f = S.f;
  if (b.dataset.subj) {
    const s = b.dataset.subj, has = x => x.trim().toLowerCase() === s.toLowerCase();
    for (const k of ["main", "sec"]) { const i = f[k].findIndex(has); if (i >= 0) { f[k][i] = ""; render(); return; } }
    if (!mains().length) setSlot("main", s); else setSlot("sec", s) || setSlot("main", s);
    render(); return;
  }
  if (b.dataset.size) { f.size = b.dataset.size; if (!isMulti()) f.space = ""; render(); return; }
  if (b.dataset.space) { f.space = b.dataset.space; render(); return; }
  if (b.dataset.bg) { f.bg = b.dataset.bg; render(); return; }
  if (b.dataset.color) { f.color = b.dataset.color; render(); return; }
  if (b.dataset.rm) { S.photos.splice(+b.dataset.rm, 1); if (!S.briefEdited) S.brief = briefText(); render(); return; }
  if (b.dataset.copy) { const m = S.log[+b.dataset.copy]; try { await navigator.clipboard.writeText(m.prompt); b.textContent = "Copied"; } catch { b.previousElementSibling.select(); } return; }
  if (a === "go") { S.stage = "plan"; render(); }
  else if (a === "next") { S.step++; if (S.step === 4) startRiff(); if (S.step === 5 && !S.briefEdited) S.brief = briefText(); render(); window.scrollTo(0, 0); }
  else if (a === "prev") { S.step--; render(); }
  else if (a === "restart") {
    if (!S.confirmRestart) { S.confirmRestart = true; render(); clearTimeout(S.rt); S.rt = setTimeout(() => { S.confirmRestart = false; render(); }, 4000); return; }
    clearTimeout(S.rt); Object.assign(S, fresh()); render(); window.scrollTo(0, 0);
  }
  else if (a === "em") { S.busy = true; render(); setTimeout(() => { S.busy = false; S.sentBy = "email"; S.stage = "sent"; render(); }, 900); }
  else if (a === "ig") { try { await navigator.clipboard.writeText(document.getElementById("bt").value); S.copied = true; } catch { S.copied = false; } S.sentBy = "dm"; S.stage = "sent"; render(); }
  else if (a === "back5") { S.stage = "plan"; S.step = 5; render(); }
});

app.addEventListener("change", e => {
  if (e.target.id !== "ph") return;
  const files = [...e.target.files].slice(0, 5 - S.photos.length);
  Promise.all(files.map(f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); })))
    .then(urls => { S.photos.push(...urls); if (!S.briefEdited) S.brief = briefText(); render(); })
    .catch(() => { S.err = "One of those photos couldn't be read. Try a JPEG or PNG."; render(); });
});
app.addEventListener("keydown", e => { if (e.target.id === "in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(e.target.value); } });
app.addEventListener("submit", e => { e.preventDefault(); const i = document.getElementById("in"); if (i) send(i.value); });
render();
}

</script>
</body>
</html>
